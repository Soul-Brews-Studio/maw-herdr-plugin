name: Herdr serve

on:
  push:
    branches: [main, feat/herdr-serve]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: server/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Compile, isolated API tests, and vet
        working-directory: server
        env:
          GOWORK: 'off'
        run: |
          go build -o "$RUNNER_TEMP/maw-herdr-serve" .
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          "$RUNNER_TEMP/maw-herdr-serve" --help
      - name: Plugin and source/bundle launcher smoke (no live daemon)
        run: |
          node --check index.mjs
          node --check src/serve/mod.runServe.mjs
          bash -n smoke.sh
          bun index.mjs help
          bun index.mjs serve --help
          node utils/smoke-serve-launcher.mjs
