name: Herdr serve

on:
  push:
    branches: [main, feat/herdr-serve, feat/bun-herdr-serve, feat/herdr-terminal-stream]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
          - { runner: macos-15, os: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: server/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Compile, isolated API tests, and vet
        working-directory: server
        env:
          GOWORK: 'off'
        run: |
          go build -o "$RUNNER_TEMP/maw-herdr-serve" .
          go test -race ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          "$RUNNER_TEMP/maw-herdr-serve" --help
      - name: Plugin and source/bundle launcher smoke (no live daemon)
        run: |
          node --check index.mjs
          node --check src/serve/mod.runServe.mjs
          bash -n smoke.sh
          bun index.mjs help
          bun index.mjs serve --help
          bun build index.mjs --target=bun --outfile "$RUNNER_TEMP/herdr-bun.js"
          node utils/smoke-serve-launcher.mjs
          bun utils/smoke-bun-serve.mjs
          bun utils/smoke-federation-config.ts
          node utils/smoke-federation-serve.mjs
          bun utils/smoke-maw-config.ts
          node utils/smoke-config-serve.mjs
          bun utils/smoke-registry-wake.ts
          node utils/smoke-registry-serve.mjs
          bun utils/smoke-task-plan.ts
          node utils/smoke-task-serve.mjs
          bun utils/smoke-wake-launch.ts
          node utils/smoke-launch-serve.mjs
          MAW_REGISTRY_ENTRY="$RUNNER_TEMP/herdr-bun.js" node utils/smoke-registry-serve.mjs
          MAW_TASK_ENTRY="$RUNNER_TEMP/herdr-bun.js" node utils/smoke-task-serve.mjs
          MAW_LAUNCH_ENTRY="$RUNNER_TEMP/herdr-bun.js" node utils/smoke-launch-serve.mjs
          node utils/smoke-registry-serve.mjs "$RUNNER_TEMP/maw-herdr-serve"
          node utils/smoke-task-serve.mjs "$RUNNER_TEMP/maw-herdr-serve"
          node utils/smoke-launch-serve.mjs "$RUNNER_TEMP/maw-herdr-serve"
          MAW_CONFIG_ENTRY="$RUNNER_TEMP/herdr-bun.js" node utils/smoke-config-serve.mjs
          node utils/smoke-config-serve.mjs "$RUNNER_TEMP/maw-herdr-serve"
          MAW_FEDERATION_ENTRY="$RUNNER_TEMP/herdr-bun.js" node utils/smoke-federation-serve.mjs
          node utils/smoke-federation-serve.mjs "$RUNNER_TEMP/maw-herdr-serve"
          bun utils/smoke-terminal-serve.mjs
          MAW_TERMINAL_ENTRY="$RUNNER_TEMP/herdr-bun.js" bun utils/smoke-terminal-serve.mjs
          bun utils/smoke-terminal-limits.ts
          bun utils/smoke-terminal-serve.mjs "$RUNNER_TEMP/maw-herdr-serve"
      - name: Build source-independent native plugin package
        run: |
          node --check utils/package-serve.mjs
          node --check utils/smoke-serve-package.mjs
          node utils/package-serve.mjs --os '${{ matrix.os }}' --arch '${{ matrix.arch }}' --out "$RUNNER_TEMP/herdr-package"
          node utils/smoke-serve-package.mjs "$RUNNER_TEMP/herdr-package"
          tar -czf "$RUNNER_TEMP/maw-herdr-plugin-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP/herdr-package" .
      - name: Upload verified native plugin package (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maw-herdr-plugin-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/maw-herdr-plugin-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14
